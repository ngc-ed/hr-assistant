# Blueprint de Render. El nombre del servicio es igual al del repositorio.
services:
  - type: web
    name: hr-assistant
    runtime: docker
    plan: free
    healthCheckPath: /health
    # Render publica solo si el pipeline de CI pasa
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PROVIDER
        value: gateway
      # Workers de uvicorn; /metrics y el límite de peticiones son por proceso
      - key: WEB_CONCURRENCY
        value: "2"
      # El límite de peticiones es por proceso y por cliente (clave). Con el valor
      # por omisión (30) la carga de verificación, con una sola clave, se
      # rechazaba con 429; se sube para permitirla.
      - key: RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: HIDE_INPUTS
        value: "true"
      - key: HIDE_OUTPUTS
        value: "true"
      # Secretos: se escriben en Render, nunca en el repositorio
      - key: API_KEYS
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
